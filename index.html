<script>
(()=>{'use strict';
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const icon=(name,size=22)=>`<svg class="icon" style="width:${size}px;height:${size}px" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const resources=[
{id:'r1',title:'Class 10 Maths Formula Sheet',category:'school',subject:'Mathematics',type:'Free',format:'PDF',icon:'calculator',art:'#eef7f3',ink:'#27745a',level:'Class 10',language:'English'},
{id:'r2',title:'Class 12 Economics — Important Questions',category:'school',subject:'Economics',type:'Premium',format:'NOTES',icon:'chart',art:'#fff6e6',ink:'#a46b0d',level:'Class 12',language:'Hindi + English'},
{id:'r3',title:'NCERT Science Revision Notes',category:'school',subject:'Science',type:'Free',format:'PDF',icon:'atom',art:'#eef5ff',ink:'#2e69a2',level:'Class 9–10',language:'Hindi + English'},
{id:'r4',title:'College Semester Study Notes',category:'college',subject:'Semester notes',type:'Free',format:'NOTES',icon:'graduation',art:'#f1edff',ink:'#6b58a8',level:'College',language:'English'},
{id:'r5',title:'CUET General Test Practice',category:'competitive',subject:'CUET',type:'Premium',format:'PRACTICE',icon:'exam',art:'#fff0f0',ink:'#b34d57',level:'Entrance exam',language:'Hindi + English'},
{id:'r6',title:'Competitive Exam Current Affairs',category:'competitive',subject:'Current affairs',type:'Free',format:'NOTES',icon:'globe',art:'#eaf8fb',ink:'#227b8d',level:'Competitive exams',language:'Hindi'},
{id:'r7',title:'English Grammar Quick Revision',category:'skills',subject:'English',type:'Free',format:'GUIDE',icon:'book-open',art:'#fff4e8',ink:'#a76324',level:'All levels',language:'English'},
{id:'r8',title:'Coding Basics — Starter Guide',category:'skills',subject:'Coding',type:'Premium',format:'GUIDE',icon:'code',art:'#ebf7f7',ink:'#087e83',level:'Beginner',language:'English'},
{id:'r9',title:'Business & Money Reading Notes',category:'books',subject:'Business',type:'Free',format:'READING',icon:'briefcase',art:'#f4f1e9',ink:'#80612b',level:'Beyond academics',language:'English'},
{id:'r10',title:'Study Skills & Time Planning',category:'skills',subject:'Study skills',type:'Free',format:'GUIDE',icon:'clock',art:'#eef5ff',ink:'#486d9d',level:'All levels',language:'Hindi + English'},
{id:'r11',title:'JEE Physics Formula Revision',category:'competitive',subject:'Physics',type:'Premium',format:'PDF',icon:'atom',art:'#eef7f3',ink:'#27745a',level:'JEE',language:'Hindi + English'},
{id:'r12',title:'Project Report Format',category:'college',subject:'Projects',type:'Free',format:'TEMPLATE',icon:'file',art:'#f1edff',ink:'#6b58a8',level:'School & college',language:'English'},
{id:'r13',title:'Class 11 Accountancy Basics',category:'school',subject:'Accountancy',type:'Free',format:'NOTES',icon:'calculator',art:'#eaf8fb',ink:'#227b8d',level:'Class 11',language:'Hindi + English'},
{id:'r14',title:'NEET Biology Chapter Practice',category:'competitive',subject:'Biology',type:'Premium',format:'PRACTICE',icon:'atom',art:'#eaf7ec',ink:'#318047',level:'NEET',language:'Hindi + English'},
{id:'r15',title:'Habits, Mindset & Personal Finance',category:'books',subject:'Personal growth',type:'Premium',format:'READING',icon:'brain',art:'#fff6e6',ink:'#a46b0d',level:'Beyond academics',language:'English'}
];
const categories=[
{id:'school',name:'School',icon:'graduation',tone:'#e9f6f0',color:'#287859',count:'Classes 1–12 · CBSE · State'},
{id:'college',name:'College',icon:'book-open',tone:'#f0edff',color:'#6d5ab0',count:'Courses · Semester · Projects'},
{id:'competitive',name:'Competitive Exams',icon:'atom',tone:'#fff0ee',color:'#b44f50',count:'JEE · NEET · CUET · SSC'},
{id:'skills',name:'Skills',icon:'lightbulb',tone:'#eaf7fb',color:'#167d8b',count:'Coding · English · Business'},
{id:'books',name:'Books & Reading',icon:'book',tone:'#fff6e6',color:'#a46b0d',count:'Business · Money · Biographies'}
];
const quick=[{id:'quiz',name:'Quick Quiz',icon:'quiz'},{id:'mock',name:'Mock Exam',icon:'exam'},{id:'projects',name:'Projects',icon:'folder'},{id:'saved',name:'Saved Items',icon:'bookmark'}];
const quizSets={
'Basics':[{q:'Which part of a book usually lists its chapters?',opts:['Index','Table of contents','Glossary','Appendix'],a:1},{q:'What does a percentage represent?',opts:['A ratio out of 100','A distance','A temperature','A date'],a:0},{q:'Which is a useful study habit?',opts:['Skip revision','Study without breaks','Review notes regularly','Keep every task for the last day'],a:2}],
'Maths':[{q:'What is 15% of 200?',opts:['15','20','30','45'],a:2},{q:'What is the square of 12?',opts:['124','144','122','132'],a:1},{q:'If x + 7 = 15, what is x?',opts:['6','7','8','9'],a:2}],
'Science':[{q:'Which gas do plants absorb during photosynthesis?',opts:['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],a:1},{q:'What is the SI unit of force?',opts:['Joule','Watt','Newton','Pascal'],a:2},{q:'Which planet is known as the Red Planet?',opts:['Venus','Mars','Jupiter','Mercury'],a:1}],
'English':[{q:'Choose the correct spelling.',opts:['Enviroment','Environment','Envirnoment','Environmant'],a:1},{q:'Which word is a verb?',opts:['Quickly','Bright','Write','Blue'],a:2},{q:'Choose the plural of “child”.',opts:['Childs','Childes','Children','Childrens'],a:2}]
};
let state={section:'home',query:'',category:'all',type:'all',saved:loadSaved(),lang:localStorage.getItem('tloribless-lang')||'en',quiz:null,quizIndex:0,quizAnswers:[],quizScore:0};
const hiText={"Notifications":"सूचनाएँ","You're all caught up":"कोई नई सूचना नहीं","Notification settings":"सूचना सेटिंग","Your space":"आपकी जगह","Saved items":"सेव की गई सामग्री","Saved Items":"सेव की गई सामग्री","Account & sign in":"खाता और साइन इन","Language":"भाषा","Study preferences":"अध्ययन सेटिंग","Navigate":"नेविगेशन","Home":"होम","Library":"लाइब्रेरी","Projects":"प्रोजेक्ट्स","Quiz":"क्विज़","Mock Exam":"मॉक एग्ज़ाम","Study planner":"स्टडी प्लानर","Progress":"प्रगति","Settings & privacy":"सेटिंग्स और प्राइवेसी","Study Material":"स्टडी मटेरियल","View library":"लाइब्रेरी देखें","Browse categories":"कैटेगरी चुनें","Quick access":"क्विक एक्सेस","Popular resources":"लोकप्रिय सामग्री","See all":"सभी देखें","Study tools":"स्टडी टूल्स","School":"स्कूल","College":"कॉलेज","Competitive Exams":"प्रतियोगी परीक्षाएँ","Skills":"स्किल्स","Books & Reading":"किताबें और रीडिंग","Quick Quiz":"क्विक क्विज़","Reset filters":"फ़िल्टर रीसेट करें","All":"सभी","Free":"फ्री","Premium":"प्रीमियम","All categories":"सभी कैटेगरी","Your results":"आपके नतीजे","Practice history":"अभ्यास का रिकॉर्ड","3 questions":"3 प्रश्न","Start quiz":"क्विज़ शुरू करें","Start exam":"एग्ज़ाम शुरू करें","Practice complete":"अभ्यास पूरा हुआ","Perfect score.":"पूरे अंक!","Practice makes progress.":"अभ्यास से सुधार होता है।","Keep practising and try again.":"अभ्यास जारी रखें और फिर कोशिश करें।","This device":"यह डिवाइस","Study target saved on this device":"स्टडी टारगेट इस डिवाइस पर सेव हुआ","Back to":"वापस जाएँ","View resource":"सामग्री देखें","Remove from saved":"सेव सूची से हटाएँ","Save resource":"सामग्री सेव करें","Project guide":"प्रोजेक्ट गाइड","Open template":"टेम्पलेट खोलें","Today's study target":"आज का स्टडी टारगेट","Enter a study target first":"पहले स्टडी टारगेट लिखें","Clear local history":"इस डिवाइस का रिकॉर्ड हटाएँ","No saved items yet":"अभी कोई सामग्री सेव नहीं है","No resources found":"कोई सामग्री नहीं मिली","Try a shorter search or reset the filters.":"दूसरा शब्द लिखें या फ़िल्टर रीसेट करें।","Try a different search or category.":"दूसरी खोज या कैटेगरी चुनें।","Search":"खोजें","Privacy":"प्राइवेसी","Terms":"नियम","About":"परिचय","This is a sample catalog card.":"यह कैटलॉग का नमूना कार्ड है।"};
function applyLanguage(root=document){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(n._en===undefined)n._en=n.nodeValue;const original=n._en;const trim=original.trim();if(!trim)return;const translated=state.lang==='hi'?(hiText[trim]||trim):trim;const lead=original.match(/^\s*/)?.[0]||'',trail=original.match(/\s*$/)?.[0]||'';n.nodeValue=lead+translated+trail});if(root===document||root===document.body){const search=$('#globalSearch');if(search)search.placeholder=state.lang==='hi'?'नोट्स, विषय या परीक्षा खोजें…':'Search notes, subjects, exams…';$('#languageTrail').textContent=state.lang==='hi'?'हिन्दी':'English / हिन्दी';}}

function loadSaved(){try{return JSON.parse(localStorage.getItem('tloribless-saved')||'[]')}catch(_){return []}}
function saveSaved(){try{localStorage.setItem('tloribless-saved',JSON.stringify(state.saved))}catch(_){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function closePopups(except=''){['notificationPopup','profilePopup','menuPopup'].forEach(id=>{if(id!==except)$('#'+id).classList.remove('open')});['notificationBtn','profileBtn','menuBtn'].forEach(id=>{if((id==='notificationBtn'&&except!=='notificationPopup')||(id==='profileBtn'&&except!=='profilePopup')||(id==='menuBtn'&&except!=='menuPopup'))$('#'+id).setAttribute('aria-expanded','false')})}
function togglePopup(id,btn){const was=$('#'+id).classList.contains('open');closePopups();if(!was){$('#'+id).classList.add('open');btn.setAttribute('aria-expanded','true')}}
function setSection(section){state.section=section;closePopups();$('#searchResults').classList.remove('open');if(section!=='library'&&section!=='saved'){state.query='';$('#globalSearch').value=''}render();window.scrollTo({top:0,behavior:'smooth'})}
function resourceCard(r){const saved=state.saved.includes(r.id);return `<article class="resource-card"><div class="resource-art" style="--art:${r.art};--art-ink:${r.ink}"><span class="art-icon">${icon(r.icon,26)}</span><span class="resource-format">${esc(r.format)}</span></div><div class="resource-body"><div class="resource-meta"><span class="pill ${r.type.toLowerCase()}">${r.type==='Free'?'Free': 'Premium'}</span><span class="pill">${esc(r.level)}</span></div><h3>${esc(r.title)}</h3><div class="resource-foot"><button class="subtle-button" data-resource="${r.id}">View resource ${icon('arrow',15)}</button><button class="save-button ${saved?'saved':''}" data-save="${r.id}" aria-label="${saved?'Remove saved item':'Save item'}" title="${saved?'Saved':'Save'}">${icon('bookmark',17)}</button></div></div></article>`}
function filteredResources(){return resources.filter(r=>{const q=state.query.trim().toLowerCase();const matchQ=!q||[r.title,r.subject,r.level,r.category,r.language,r.format].join(' ').toLowerCase().includes(q);const matchC=state.category==='all'||r.category===state.category;const matchT=state.type==='all'||r.type.toLowerCase()===state.type;const matchS=state.section!=='saved'||state.saved.includes(r.id);return matchQ&&matchC&&matchT&&matchS})}
function emptyState(title,txt='Try a different search or category.'){return `<div class="empty-state">${icon('search',30)}<strong>${esc(title)}</strong><span>${esc(txt)}</span></div>`}
function home(){return `<div class="page-head fade-in"><h1 class="page-title">Study Material</h1><button class="subtle-button" data-section="library">View library ${icon('arrow',16)}</button></div>
<section class="section"><div class="section-heading"><h2>Browse categories</h2></div><div class="category-grid">${categories.map(c=>`<button class="category-card" data-category="${c.id}" style="--tone:${c.tone};--color:${c.color};--orb:${c.tone}"><span class="category-icon" style="--tone:${c.tone};--color:${c.color}">${icon(c.icon,24)}</span><strong>${c.name}</strong><span class="count">${c.count}</span></button>`).join('')}</div></section>
<section class="section"><div class="section-heading"><h2>Quick access</h2></div><div class="quick-grid">${quick.map(q=>`<button class="quick-card" data-section="${q.id}"><span class="quick-icon">${icon(q.icon,21)}</span><span><strong>${q.name}</strong></span></button>`).join('')}</div></section>
<section class="section"><div class="section-heading"><h2>Popular resources</h2><button class="link-button" data-section="library">See all ${icon('arrow',14)}</button></div><div class="resources">${[resources[0],resources[1],resources[4]].map(resourceCard).join('')}</div></section>
<section class="section"><div class="section-heading"><h2>Study tools</h2></div><div class="page-grid"><article class="feature-card"><span class="feature-icon">${icon('quiz',24)}</span><h3>Quiz practice</h3><button class="subtle-button" data-section="quiz">Start a quiz ${icon('arrow',15)}</button></article><article class="feature-card"><span class="feature-icon">${icon('exam',24)}</span><h3>Mock exams</h3><button class="subtle-button" data-section="mock">Practice now ${icon('arrow',15)}</button></article><article class="feature-card"><span class="feature-icon">${icon('folder',24)}</span><h3>Projects & templates</h3><button class="subtle-button" data-section="projects">Open projects ${icon('arrow',15)}</button></article></div></section>`}
function library(){const filtered=filteredResources();return `<div class="page-head"><h1 class="page-title">${state.section==='saved'?'Saved Items':'Library'}</h1><button class="subtle-button" data-action="clearFilters">${icon('filter',16)} Reset filters</button></div><div class="catalog-top"><div class="library-tools"><button class="filter-button ${state.type==='all'?'active':''}" data-type="all">All</button><button class="filter-button ${state.type==='free'?'active':''}" data-type="free">Free</button><button class="filter-button ${state.type==='premium'?'active':''}" data-type="premium">Premium</button></div><span class="result-count">${filtered.length} resources</span></div><div class="library-tools" aria-label="Categories"><button class="filter-button ${state.category==='all'?'active':''}" data-category-filter="all">All categories</button>${categories.map(c=>`<button class="filter-button ${state.category===c.id?'active':''}" data-category-filter="${c.id}">${c.name}</button>`).join('')}</div>${state.query?`<div class="result-count" style="margin-bottom:12px">Search: “${esc(state.query)}” <button class="link-button" data-action="clearQuery">Clear</button></div>`:''}<div class="resources">${filtered.map(resourceCard).join('')||emptyState(state.section==='saved'?'No saved items yet':'No resources found',state.section==='saved'?'Tap the bookmark on any resource to save it here.':'Try a shorter search or reset the filters.')}</div>`}
function projects(){const cards=[['Project report template','file','School & college','A clean structure for reports and assignments.'],['Business plan outline','briefcase','Business studies','Organise a concept, market and budget.'],['Science project ideas','atom','Science','Choose a topic and plan the experiment.'],['Study timetable','clock','Planning','Build a simple weekly study plan.'],['Presentation planner','chart','Presentations','Outline slides before designing them.'],['Research notes board','pen','Research','Collect sources and arrange key points.']];return `<div class="page-head"><h1 class="page-title">Projects</h1><button class="subtle-button" data-action="projectInfo">${icon('folder',16)} Project guide</button></div><div class="page-grid">${cards.map((c,i)=>`<article class="feature-card"><div class="feature-top"><span class="feature-icon">${icon(c[1],23)}</span><span class="pill">${c[2]}</span></div><h3>${c[0]}</h3><button class="subtle-button" data-project="${i}">Open template ${icon('arrow',15)}</button></article>`).join('')}</div>`}
function quizzes(isMock=false){const opts=isMock?['Maths Mock Exam','Science Mock Exam','English Mock Exam','General Knowledge Mock Exam']:['Basics Quiz','Maths Quiz','Science Quiz','English Quiz'];return `<div class="page-head"><h1 class="page-title">${isMock?'Mock Exam':'Quiz'}</h1><span class="pill">${isMock?'Timed practice':'Quick practice'}</span></div><div class="page-grid">${opts.map((name,i)=>`<article class="feature-card"><div class="feature-top"><span class="feature-icon">${icon(isMock?'exam':'quiz',24)}</span><span class="pill">3 questions</span></div><h3>${name}</h3><button class="primary-button" data-startquiz="${isMock?name.replace(' Mock Exam',''):name.replace(' Quiz','')}" data-mock="${isMock?'yes':'no'}">${isMock?'Start exam':'Start quiz'} ${icon('arrow',15)}</button></article>`).join('')}</div><section class="section"><div class="section-heading"><h2>Your results</h2></div><div class="feature-card" style="min-height:unset"><div class="feature-top"><span class="feature-icon">${icon('chart',24)}</span><span class="pill">This device</span></div><h3>Practice history</h3><p style="font-size:12px;color:var(--muted);margin:0 0 12px">${Number(localStorage.getItem('tloribless-quizzes')||0)} completed sessions</p><button class="subtle-button" data-action="clearProgress">Clear local history</button></div></section>`}
function render(){const main=$('#main');main.innerHTML=state.section==='home'?home():state.section==='library'||state.section==='saved'?library():state.section==='projects'?projects():state.section==='quiz'?quizzes(false):state.section==='mock'?quizzes(true):home();$$('.nav-item').forEach(btn=>{const active=btn.dataset.section===state.section||(state.section==='saved'&&btn.dataset.section==='library');btn.classList.toggle('active',active);if(active)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current')});$('#globalSearch').value=state.query;applyLanguage(main);}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalTitle')._en=title;$('#modalBody').innerHTML=body;$('#modalBackdrop').classList.add('open');applyLanguage($('#modalTitle'));applyLanguage($('#modalBody'));document.body.style.overflow='hidden'}
function closeModal(){$('#modalBackdrop').classList.remove('open');document.body.style.overflow=''}
function aboutAction(action){closePopups();const content={account:['Account & sign in',`<p>Secure accounts, cloud sync and paid purchases need a connected backend. This demo does not collect passwords or payment details.</p><p><strong>Current version:</strong> browsing, search, quiz practice and saved items on this device.</p>`],settings:['Study preferences',`<p>Choose a display language from the profile menu. Saved items and practice counts are stored only in this browser.</p><p>Do not add private student details to this public demo.</p>`],language:['Language',`<p>Choose the interface language.</p><button class="subtle-button" data-language="en">English</button> <button class="subtle-button" data-language="hi">हिन्दी</button>`],planner:['Study planner',`<p>A planner view is reserved here. A persistent planner across devices will need a secure account service.</p><label for="planText">Today's study target</label><input id="planText" placeholder="e.g. Revise 2 chapters" style="width:100%;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:10px"><button class="primary-button" data-action="savePlan">Save on this device</button>`],progress:['Progress',`<p>Practice sessions completed on this device: <strong>${Number(localStorage.getItem('tloribless-quizzes')||0)}</strong>.</p><p>Detailed progress tracking can be added when account storage is connected.</p>`],privacy:['Privacy',`<p>This prototype stores saved resource IDs, language choice and practice count in local browser storage. No sign-in or payment details are collected.</p><p>Before opening the site to real users, add a complete privacy policy and a secure account/data service.</p>`],terms:['Terms',`<p>Sample catalog entries are placeholders and are not real downloadable study materials. Publish only resources you created, licensed or have permission to distribute.</p>`],about:['About Tloribless',`<p><strong>Tloribless</strong> — Built for Your Next Move.</p><p>A study-resource concept for notes, projects, quizzes and mock exams.</p>`],projectInfo:['Project guide',`<p>Choose a template to plan a project. Add the real files and instructions before publishing this site to students.</p>`],notifications:['Notifications',`<p>You're all caught up.</p>`]};const item=content[action]||['Coming soon',`<p>This area is a placeholder in the current frontend demo.</p>`];openModal(item[0],item[1])}
function resourceInfo(id){const r=resources.find(x=>x.id===id);if(!r)return;openModal(r.title,`<div class="resource-meta"><span class="pill ${r.type.toLowerCase()}">${r.type}</span><span class="pill">${esc(r.format)}</span><span class="pill">${esc(r.language)}</span></div><p><strong>Subject:</strong> ${esc(r.subject)}</p><p><strong>Level:</strong> ${esc(r.level)}</p><p>This is a sample catalog card. Add the actual PDF, notes or authorized resource link before publishing it as downloadable content.</p><button class="primary-button" data-save="${r.id}">${state.saved.includes(r.id)?'Remove from saved':'Save resource'} ${icon('bookmark',16)}</button>`)}
function startQuiz(name,isMock){const key=name==='Basics'?'Basics':name==='Maths'?'Maths':name==='Science'?'Science':name==='English'?'English':'Basics';state.quiz={name,isMock,questions:quizSets[key]||quizSets.Basics};state.quizIndex=0;state.quizAnswers=[];showQuizQuestion()}
function showQuizQuestion(){const q=state.quiz.questions[state.quizIndex];const total=state.quiz.questions.length;const idx=state.quizIndex;openModal(state.quiz.isMock?'Mock Exam: '+state.quiz.name:'Quiz: '+state.quiz.name,`<div class="result-count">Question ${idx+1} of ${total}${state.quiz.isMock?' · Practice timer not connected':''}</div><div class="quiz-progress"><span style="width:${((idx)/total)*100}%"></span></div><p class="quiz-question">${esc(q.q)}</p><form id="quizForm">${q.opts.map((o,i)=>`<label class="quiz-option"><input type="radio" name="answer" value="${i}" required> <span>${esc(o)}</span></label>`).join('')}<button class="primary-button" type="submit" style="width:100%;margin-top:12px">${idx===total-1?'Finish':'Next question'} ${icon('arrow',15)}</button></form>`)}
$('#main').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.section){setSection(b.dataset.section);return}if(b.dataset.category){state.category=b.dataset.category;state.type='all';state.section='library';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.categoryFilter){state.category=b.dataset.categoryFilter;render();return}if(b.dataset.type){state.type=b.dataset.type;render();return}if(b.dataset.resource){resourceInfo(b.dataset.resource);return}if(b.dataset.save){const id=b.dataset.save;if(state.saved.includes(id)){state.saved=state.saved.filter(x=>x!==id);toast('Removed from saved items')}else{state.saved.push(id);toast('Saved to your library')}saveSaved();render();if($('#modalBackdrop').classList.contains('open')){const r=resources.find(x=>x.id===id);if(r)resourceInfo(id)}return}if(b.dataset.startquiz){startQuiz(b.dataset.startquiz,b.dataset.mock==='yes');return}if(b.dataset.action){const a=b.dataset.action;if(a==='clearFilters'){state.category='all';state.type='all';state.query='';render();return}if(a==='clearQuery'){state.query='';$('#globalSearch').value='';render();return}if(a==='clearProgress'){localStorage.removeItem('tloribless-quizzes');toast('Local practice history cleared');render();return}if(a==='savePlan'){const input=$('#planText');if(input&&input.value.trim()){try{localStorage.setItem('tloribless-plan',input.value.trim())}catch(_){}toast('Study target saved on this device');closeModal()}else toast('Enter a study target first');return}aboutAction(a);return}if(b.dataset.project!==undefined){const names=['Project report template','Business plan outline','Science project ideas','Study timetable','Presentation planner','Research notes board'];const name=names[Number(b.dataset.project)]||'Project template';openModal(name,`<p>Use this starter checklist to prepare your project.</p><ol><li>Set a clear topic and objective.</li><li>Collect reliable sources.</li><li>Prepare an outline and key points.</li><li>Review formatting, references and spelling.</li></ol><p>Attach the actual editable template before making this resource public.</p>`);return}});
$('#globalSearch').addEventListener('input',e=>{state.query=e.target.value;const q=state.query.trim().toLowerCase(),panel=$('#searchResults');if(!q){panel.classList.remove('open');if(state.section==='library'||state.section==='saved')render();return}const matches=resources.filter(r=>[r.title,r.subject,r.level,r.category,r.language].join(' ').toLowerCase().includes(q)).slice(0,6);panel.innerHTML=matches.length?matches.map(r=>`<button class="search-result" role="option" data-search-resource="${r.id}"><span class="result-icon">${icon(r.icon,19)}</span><span><strong>${esc(r.title)}</strong><small>${esc(r.subject)} · ${esc(r.level)}</small></span></button>`).join('')+`<button class="search-result" data-search-all="true"><span class="result-icon">${icon('search',18)}</span><span><strong>See all results</strong><small>Open Library</small></span></button>`:`<div class="search-empty">No matching resource. Try another keyword.</div>`;panel.classList.add('open');applyLanguage(panel);if(state.section==='library'||state.section==='saved')render()});
$('#searchResults').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.searchResource;$('#searchResults').classList.remove('open');if(id){state.section='library';state.query=resources.find(r=>r.id===id).title;render();resourceInfo(id)}else if(b.dataset.searchAll){state.section='library';render()}});
$('#notificationBtn').addEventListener('click',()=>togglePopup('notificationPopup',$('#notificationBtn')));$('#profileBtn').addEventListener('click',()=>togglePopup('profilePopup',$('#profileBtn')));$('#menuBtn').addEventListener('click',()=>togglePopup('menuPopup',$('#menuBtn')));
document.addEventListener('click',e=>{if(!e.target.closest('.topbar')&&!e.target.closest('.popup'))closePopups();if(!e.target.closest('.search-wrap')&&!e.target.closest('.search-results'))$('#searchResults').classList.remove('open')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-language]');if(b){state.lang=b.dataset.language;localStorage.setItem('tloribless-lang',state.lang);closeModal();$('#languageTrail').textContent=state.lang==='hi'?'हिन्दी':'English';applyLanguage(document.body);render();toast(state.lang==='hi'?'भाषा चुनी गई। कुछ सामग्री अंग्रेज़ी में रह सकती है।':'Language selected.');return}});
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b||b.closest('#main'))return;if(b.tagName==='A'&&b.dataset.action)e.preventDefault();if(b.dataset.section){setSection(b.dataset.section);return}if(b.dataset.action){const a=b.dataset.action;if(a==='clearFilters'){state.category='all';state.type='all';state.query='';render();return}if(a==='clearQuery'){state.query='';$('#globalSearch').value='';render();return}if(a==='clearProgress'){localStorage.removeItem('tloribless-quizzes');toast('Local practice history cleared');render();return}if(a==='savePlan'){const input=$('#planText');if(input&&input.value.trim()){try{localStorage.setItem('tloribless-plan',input.value.trim())}catch(_){}toast('Study target saved on this device');closeModal()}else toast('Enter a study target first');return}aboutAction(a);return}if(b.dataset.save){const id=b.dataset.save;if(state.saved.includes(id)){state.saved=state.saved.filter(x=>x!==id);toast('Removed from saved items')}else{state.saved.push(id);toast('Saved to your library')}saveSaved();render();if($('#modalBackdrop').classList.contains('open'))resourceInfo(id);return}});
$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePopups();$('#searchResults').classList.remove('open')}});
document.addEventListener('submit',e=>{if(e.target.id==='quizForm'){e.preventDefault();const picked=e.target.querySelector('input[name="answer"]:checked');if(!picked){toast('Choose an answer first');return}state.quizAnswers.push(Number(picked.value));if(state.quizIndex<state.quiz.questions.length-1){state.quizIndex++;showQuizQuestion()}else{const score=state.quizAnswers.reduce((s,a,i)=>s+(a===state.quiz.questions[i].a?1:0),0);try{localStorage.setItem('tloribless-quizzes',String(Number(localStorage.getItem('tloribless-quizzes')||0)+1))}catch(_){}openModal('Practice complete',`<div style="text-align:center;padding:8px 0 15px"><div class="feature-icon" style="margin:0 auto 14px;width:58px;height:58px">${icon('check',30)}</div><h3 style="font-size:28px;margin:0 0 4px;color:var(--teal)">${score}/${state.quiz.questions.length}</h3><p>${score===state.quiz.questions.length?'Perfect score.':score>0?'Practice makes progress.':'Keep practising and try again.'}</p></div><button class="primary-button" style="width:100%" id="finishQuiz">Back to ${state.quiz.isMock?'Mock Exam':'Quiz'} list</button>`);$('#finishQuiz').addEventListener('click',()=>{closeModal();render()})}}});
$('#year').textContent=new Date().getFullYear();render();applyLanguage(document.body);
})();
</script>
</body>
</html>
